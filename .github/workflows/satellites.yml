name: Satellite catalog

# Daily refresh of the satellite orbit data (spec: docs/superpowers/specs/2026-10-28-earth-satellites-design.md
# §5.2). SGP4 elements go stale by kilometres a day, so nobody uploads this by hand: the run fetches
# CelesTrak, builds satellites.satg and overwrites its fixed R2 key. A failed run uploads nothing and
# the app keeps the previous file; after 14 days without a good run the app fades the satellites out.
#
# Secrets: CLOUDFLARE_API_TOKEN (R2 write on skymap-data) and CLOUDFLARE_ACCOUNT_ID.

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: satellite-catalog
  cancel-in-progress: false

jobs:
  refresh:
    name: fetch · build · upload
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch CelesTrak groups
        run: npm run fetch-celestrak

      # Throws below its object floor, so an upstream outage never reaches R2.
      - name: Build satellites.satg
        run: npm run build-satellites

      # Gzipped on the wire like the R2 sync's gzipOnWire families; browsers inflate it transparently.
      # max-age=3600: a refresh reaches every visitor within an hour, with no CDN purge.
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          gzip -9 -n -c public/data/satellite-catalog/v1/satellites.satg > "$RUNNER_TEMP/satellites.satg"
          npx wrangler r2 object put skymap-data/data/satellite-catalog/v1/satellites.satg \
            --file "$RUNNER_TEMP/satellites.satg" \
            --content-type application/octet-stream \
            --content-encoding gzip \
            --cache-control 'public, max-age=3600' \
            --remote
