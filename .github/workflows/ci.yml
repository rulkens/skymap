name: CI

# Runs on every push to main and every pull request targeting main.
# The README's CONTRIBUTING.md asks contributors to keep the test suite
# green; this workflow enforces it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: typecheck · test · format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit on both src and tools tsconfigs.
      - name: Typecheck
        run: npm run typecheck

      # eslint — narrow correctness net (Rules of Hooks, floating promises) +
      # house conventions. Hard-fails like typecheck.
      - name: Lint
        run: npm run lint

      # vitest run, single pass.  All 594 tests pass at time of writing.
      - name: Tests
        run: npm test

      # `npm run format:check` is intentionally not run in CI yet — there
      # are pre-existing files in the repo that don't match Prettier's
      # current ruleset, so wiring it up here would fail on every PR.
      # Re-enable once a one-time `npm run format` pass has been merged.
