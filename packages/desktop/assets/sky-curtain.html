<!doctype html>
<html lang="en">

    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:"
    />
    <title>Skymap</title>
    <!--
      Black over the sky while it (re)loads; loadSkyPage passes both fade times and sets opacity 0 to
      leave. It speaks the app Splash's language (src/components/Splash, src/styles/tokens.css): the
      colours and type below repeat those tokens, because this page loads from file:// with no bundle.
      Everything sits centred in the short side, so a dome's fisheye disc shows all of it.
    -->
    <script>
      const params = new URLSearchParams(location.search);
      for (const fade of ['fadeIn', 'fadeOut']) {
        document.documentElement.style.setProperty(`--${fade}`, `${params.get(fade) ?? 0}ms`);
      }
    </script>
    <style>

          format('woff2');
      }
      :root {
        --fg: #e8eeff;
        --fg-muted: rgba(200, 220, 255, 0.85);
        --fg-tertiary: rgba(200, 220, 255, 0.7);
        --accent: #a8d0ff;
        --mono: ui-monospace, 'SF Mono', Menlo, monospace;
        --unit: min(1vw, 1vh);
      }
      html {
        height: 100%;
        background: #000;
        cursor: none;
        animation: appear var(--fadeIn) ease-in;
        transition: opacity var(--fadeOut) ease-out;
      }
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      @keyframes appear {
        from {
          opacity: 0;
        }
      }
      /* Held back, so a quick reload stays plain black and only a real wait shows anything. */
      canvas,
      .glow {
        position: fixed;
        inset: 0;
        opacity: 0;
        animation: rise 2.4s ease-out 600ms forwards;
      }
      canvas {
        width: 100%;
        height: 100%;
      }
      /* A faint blue breath behind the title, the colour of the panels' starlight edge. */
      .glow {
        background: radial-gradient(
          circle at 50% 50%,
          rgba(70, 110, 200, 0.16) 0%,
          rgba(40, 70, 150, 0.06) calc(var(--unit) * 22),
          transparent calc(var(--unit) * 42)
        );
      }
      main {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        text-align: center;
      }
      main > * {
        opacity: 0;
        transform: translateY(calc(var(--unit) * 0.8));
        animation: reveal 0.5s ease-out forwards;
      }
      main > :nth-child(1) {
        animation-delay: 700ms;
      }
      main > :nth-child(2) {
        animation-delay: 800ms;
      }
      main > :nth-child(3) {
        animation-delay: 1000ms;
      }
      main > :nth-child(4) {
        animation-delay: 1200ms;
      }
      .label {
        display: flex;
        gap: calc(var(--unit) * 1.6);
        align-items: center;
        font: max(10px, calc(var(--unit) * 1.05)) var(--mono);
        letter-spacing: 0.32em;
        text-indent: 0.32em;
        color: var(--fg-muted);
      }
      .label::before,
      .label::after {
        content: '';
        width: calc(var(--unit) * 3.2);
        height: 1px;
        background: var(--accent);
      }
      h1 {
        position: relative;
        margin: calc(var(--unit) * 2.4) 0 0;
        padding-bottom: calc(var(--unit) * 2.2);
        color: #fff;
        font:
          600 max(34px, calc(var(--unit) * 6.4)) / 1.04 'Cormorant Curtain',
          'Cormorant Garamond',
          ui-serif,
          Georgia,
          serif;
        letter-spacing: 0.005em;
        text-shadow: 0 0 calc(var(--unit) * 4) rgba(120, 170, 255, 0.25);
      }
      /* The Splash's draw beat, from the centre out: the camera focusing. */
      h1::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 0;
        height: 1px;
        background: var(--accent);
        transform: translateX(-50%);
        animation: draw 1.2s ease-out 1.4s forwards;
      }
      p {
        margin: calc(var(--unit) * 2.4) 0 0;
        min-height: 1.6em;
        font: max(11px, calc(var(--unit) * 1.3)) / 1.6 var(--mono);
        letter-spacing: 0.1em;
        color: var(--fg-tertiary);
        transition:
          opacity 450ms ease,
          transform 450ms ease;
      }
      p.out {
        opacity: 0 !important;
        transform: translateY(calc(var(--unit) * -0.6)) !important;
      }
      /* SplashProgress's hairline, short and under the words instead of along the screen's edge. */
      .line {
        position: relative;
        overflow: hidden;
        width: calc(var(--unit) * 26);
        height: 1px;
        margin-top: calc(var(--unit) * 3.2);
        background: rgba(255, 255, 255, 0.06);
      }
      .line::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 30%;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        animation: sweep 1.6s ease-in-out infinite;
      }
      @keyframes rise {
        to {
          opacity: 1;
        }
      }
      @keyframes reveal {
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes draw {
        to {
          width: calc(var(--unit) * 8);
        }
      }
      @keyframes sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(340%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html,
        canvas,
        .glow,
        main > *,
        .line::after {
          animation: none;
          transition: none;
          opacity: 1;
          transform: none;
        }
        h1::after {
          animation: none;
          width: calc(var(--unit) * 8);
        }
        p {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas aria-hidden="true"></canvas>
    <div class="glow" aria-hidden="true"></div>
    <main>
      <div class="label">SKYMAP</div>
      <h1>Loading the universe</h1>
      <p role="status"></p>
      <div class="line" aria-hidden="true"></div>
    </main>
    <script>
      const still = matchMedia('(prefers-reduced-motion: reduce)').matches;

      // A joke every few seconds, so a long wait visibly moves.
      const LINES = [
        'Counting the galaxies, twice to be sure',
        'Polishing the rings of Saturn',
        'Untangling the cosmic web',
        'Waiting for light from far away',
        'Herding stray photons',
        'Dusting off the Milky Way',
        'Asking dark matter to show itself',
        'Folding spacetime for delivery',
        'Lighting a few hundred billion stars',
        'Tuning the redshift',
        'Putting the Moon in its phase',
        'Reminding Pluto it is still loved',
        'Sweeping up the asteroid belt',
        'Untwisting the spiral arms',
      ];
      const line = document.querySelector('p');
      // A random first line, never the one the last load opened with: plain chance repeats one about
      // every 14 loads. Storage can be refused; then it is only random.
      const LAST = 'skymap-curtain-first-line';
      let last = -1;
      try {
        last = Number(localStorage.getItem(LAST) ?? -1);
      } catch {}
      let at = Math.floor(Math.random() * (LINES.length - 1));
      if (last >= 0 && at >= last) at += 1;
      try {
        localStorage.setItem(LAST, String(at));
      } catch {}
      line.textContent = `${LINES[at]}…`;
      setInterval(() => {
        at = (at + 1) % LINES.length;
        if (still) return void (line.textContent = `${LINES[at]}…`);
        line.classList.add('out');
        setTimeout(() => {
          line.textContent = `${LINES[at]}…`;
          line.classList.remove('out');
        }, 450);
      }, 3200);

      // Stars on a sky that turns about the centre, once in about ten minutes: on a dome, the zenith.
      // Sizes follow a steep power law, so a few bright stars stand out of many faint ones.
      const canvas = document.querySelector('canvas');
      const ctx = canvas.getContext('2d');
      const TINTS = [
        '232, 238, 255',
        '232, 238, 255',
        '232, 238, 255',
        '168, 208, 255',
        '255, 226, 190',
      ];
      let stars = [];
      let scale = 1;
      const seed = () => {
        scale = Math.min(devicePixelRatio, 2);
        canvas.width = innerWidth * scale;
        canvas.height = innerHeight * scale;
        // Out to the corners' radius, so the turning field never shows an empty edge.
        const reach = Math.hypot(innerWidth, innerHeight) / 2;
        const count = Math.min(1400, Math.round((Math.PI * reach * reach) / 2600));
        stars = Array.from({ length: count }, () => {
          const r = reach * Math.sqrt(Math.random());
          const size = 0.35 + 1.5 * Math.random() ** 7;
          return {
            r,
            a: Math.random() * Math.PI * 2,
            size,
            alpha: size > 0.9 ? 0.75 + 0.25 * Math.random() : 0.18 + 0.7 * Math.random() ** 2.2,
            twinkle: size > 0.9 ? 0.35 : 0.15,
            phase: Math.random() * Math.PI * 2,
            speed: 0.6 + Math.random() * 1.6,
            tint: TINTS[Math.floor(Math.random() * TINTS.length)],
          };
        });
      };
      const draw = (t) => {
        const s = t / 1000;
        const turn = still ? 0 : s * ((Math.PI * 2) / 600);
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const star of stars) {
          const a = star.a + turn;
          const x = cx + Math.cos(a) * star.r * scale;
          const y = cy + Math.sin(a) * star.r * scale;
          const flicker = still
            ? 1
            : 1 - star.twinkle * (0.5 + 0.5 * Math.sin(s * star.speed + star.phase));
          const radius = star.size * scale;
          ctx.fillStyle = `rgba(${star.tint}, ${star.alpha * flicker})`;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
          // The brightest few get a soft halo, as the app's own point sprites do.
          if (star.size > 1.1) {
            const halo = ctx.createRadialGradient(x, y, 0, x, y, radius * 6);
            halo.addColorStop(0, `rgba(${star.tint}, ${0.22 * flicker})`);
            halo.addColorStop(1, `rgba(${star.tint}, 0)`);
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.arc(x, y, radius * 6, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        if (!still) requestAnimationFrame(draw);
      };
      seed();
      addEventListener('resize', () => {
        seed();
        if (still) draw(0);
      });
      requestAnimationFrame(draw);
    </script>
  </body>
</html>
