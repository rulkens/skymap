        job: "How close to the ground can I get on Earth?"
      - heading: "The Solar System"
        job: "Which planets, moons and other objects of interest can I visit?"
      - heading: "Missions"
        job: "Which spacecraft and missions does Skymap show?"
      - heading: "The Milky Way"
        job: "What does Skymap show of our own galaxy?"
      - heading: "The cosmic web and deep space"
        job: "How far out does Skymap go, and what is there?"
  - heading: "The universe in motion"
    job: "What moves in Skymap, and on what scales?"
    parts:
      - heading: "Time"
        job: "How do I move through time?"
  - heading: "Screens of all sizes"
    job: "Which screens does Skymap run on?"
    parts:
      - heading: "On your phone"
        job: "What is Skymap like on a phone?"
      - heading: "On your desktop"
        job: "What is Skymap like with a mouse and a keyboard?"
      - heading: "Domes"
        job: "How does Skymap work on a dome?"
  - heading: "Deep linking"
    job: "Can I share a view with a link?"
