job: "What is Skymap, and is it worth opening?"
sections:
  - heading: "Pick somewhere to start"
    job: "Where can I start looking, from the nearest object to the farthest?"
  - heading: "From a park to the cosmic web"
    job: "What does the one continuous flight from a park to the cosmic web show?"
  - heading: "On a phone"
    job: "Does Skymap run on my phone, and how do I move around?"
  - heading: "Take the tour"
    job: "Is there a guided route through the universe that I can follow?"
  - heading: "Use it in the classroom"
    job: "Can I use Skymap in a lesson?"
  - heading: "Put it on a dome"
    job: "Can Skymap be shown on a planetarium dome?"
  - heading: "What is measured, derived and drawn"
    job: "How much of what I see is measured, derived or drawn?"
    parts:
      - heading: "Measured"
        job: "Which parts of the scene were recorded by an instrument?"
      - heading: "Derived"
        job: "Which parts are computed from measurements?"
      - heading: "Drawn"
        job: "Which parts are a model or a choice of ours?"
  - heading: "Most pictures here are addresses"
    job: "How do I open a picture I like in the app?"
  - heading: "Credits"
    job: "Whose pictures and data are on this page?"
