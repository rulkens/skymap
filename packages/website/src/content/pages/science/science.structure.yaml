job: "Where do Skymap's numbers come from, and how far can I trust them?"
sections:
  - heading: "The sources"
    job: "Which datasets is Skymap built from?"
    parts:
      - heading: "Galaxies and quasars"
        job: "Which catalogues place the galaxies and quasars?"
      - heading: "Stars"
        job: "Which catalogue places the stars?"
      - heading: "Solar system"
        job: "Where do the orbits of the planets and moons come from?"
      - heading: "Structures and fields"
        job: "Where do the named structures and fields come from?"
      - heading: "Imagery"
        job: "Which imagery does Skymap use?"
  - heading: "Measured, derived, drawn"
    job: "What do measured, derived and drawn mean here, and which is which?"
    parts:
      - heading: "Measured"
        job: "Which parts of the scene were recorded by an instrument?"
      - heading: "Derived"
        job: "Which parts are computed from measurements?"
      - heading: "Drawn"
        job: "Which parts are a model or a choice of ours?"
  - heading: "Known simplifications"
    job: "Where does the scene depart from the sky?"
    parts:
      - heading: "Distance"
        job: "Which simplifications affect distance?"
      - heading: "Coverage"
        job: "Which simplifications affect coverage?"
      - heading: "Stars, planets and time"
        job: "Which simplifications affect stars, planets and time?"
      - heading: "Size and brightness"
        job: "Which simplifications affect size and brightness?"
  - heading: "How to cite"
    job: "How do I cite Skymap and its catalogues?"
    parts:
      - heading: "skymap"
        job: "How do I cite Skymap itself?"
      - heading: "The catalogues"
        job: "Which catalogues do I cite for the data?"
  - heading: "Further reading"
    job: "Where can I read more?"
  - heading: "Credits"
    job: "Whose pictures and data are on this page?"
