job: "Can Skymap run in our dome or exhibit, and how do I ask for it?"
sections:
  - heading: "Live or as a film"
    job: "In what formats does Skymap reach a dome, and what would be new work?"
    parts:
      - heading: "Live in the dome"
        job: "What does the live fisheye deliver, and who steers it?"
      - heading: "A film, rendered ahead"
        job: "What does a rendered film deliver, in which format?"
  - heading: "Steer the dome from a phone"
    job: "How does a phone drive the dome?"
    parts:
      - heading: "Pair it"
        job: "How do I pair a phone with the dome?"
      - heading: "Fly with your finger"
        job: "What can I do from the phone?"
      - heading: "More than one phone"
        job: "How do I add a second phone?"
      - heading: "Where it runs"
        job: "Where does the connection between phone and dome run?"
  - heading: "A screen for an exhibit"
    job: "What can Skymap do on a screen in a museum, and what would be new work?"
  - heading: "What your audience is looking at"
    job: "What is data and what is drawn on my dome, and under what terms?"
    parts:
      - heading: "Data and drawing, labelled"
        job: "Which parts of the scene are data and which are drawn?"
      - heading: "Credits and licences"
        job: "Which licences apply to a paid commission?"
      - heading: "Open source"
        job: "Can my technician read the code?"
  - heading: "How a commission runs"
    job: "What happens between my first message and delivery?"
    parts:
      - heading: "You write to us"
        job: "What do I tell you first?"
      - heading: "We answer with a plan"
        job: "What do I get back first?"
      - heading: "We send a test"
        job: "What test do I receive?"
      - heading: "We build and deliver"
        job: "What do I receive at delivery?"
  - heading: "Write to us"
    job: "How do I contact you?"
  - heading: "Credits"
    job: "Whose pictures and data are on this page?"
