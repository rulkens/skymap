job: "How do I use Skymap in a lesson, and which link do I give my pupils?"
sections:
  - heading: "Questions with a view"
    job: "Which question and link can I give my pupils today?"
    parts:
      - heading: "How many times wider is Neptune’s orbit than Mercury’s?"
        job: "Opens the planets’ orbits seen from above."
      - heading: "A radio message leaves for Voyager 1 as the lesson starts. Will it arrive before the bell?"
        job: "Opens Voyager 1, the farthest spacecraft we have sent."
      - heading: "On 21 June, can you see the North Pole? What does that mean for a day there?"
        job: "Opens Earth on 21 June."
      - heading: "On 21 December, which pole can you see? What does that do to a day where you live?"
        job: "Opens Earth on 21 December."
      - heading: "Nobody has taken this picture. How could we know the shape of a galaxy we are inside?"
        job: "Opens the Milky Way seen from outside."
      - heading: "This light left Andromeda 2.5 million years ago. Had our species appeared yet?"
        job: "Opens Andromeda, the nearest large galaxy."
      - heading: "Some dark gaps hold few galaxies; others are sky the survey missed. How could you tell them apart?"
        job: "Opens the cosmic web."
      - heading: "The mapped part has two fans. What on the sky stops a survey from seeing in between?"
        job: "Opens everything Skymap has mapped."
  - heading: "A lesson in 45 minutes"
    job: "How do I run a whole lesson with Skymap?"
    parts:
      - heading: "Notice and wonder"
        job: "How do I open a lesson on questions the pupils ask themselves?"
      - heading: "Guess, then look"
        job: "How do pupils predict, then check against the view?"
      - heading: "Find it yourselves"
        job: "How do pupils explore on their own screens?"
      - heading: "Ask how we know"
        job: "How do pupils tell what is measured from what is drawn?"
      - heading: "Before they leave"
        job: "Which question ends the lesson?"
  - heading: "Make your own link"
    job: "How do I make a link to my own view?"
    parts:
      - heading: "Find the object"
        job: "How do I find the object?"
      - heading: "Set the date"
        job: "How do I set the date and the time?"
      - heading: "Copy the address"
        job: "How do I copy the link?"
  - heading: "Before the lesson"
    job: "Will it run here, and what should I check before I rely on it?"
    parts:
      - heading: "What it runs on"
        job: "Which browsers and devices does it need?"
      - heading: "Try one link first"
        job: "What should I try before the lesson?"
      - heading: "Limits"
        job: "What can the links not do?"
  - heading: "Credits"
    job: "Whose pictures and data are on this page?"
