      - heading: "Earth on 21 June"
        job: "Opens Earth on 21 June."
      - heading: "Earth on 21 December"
        job: "Opens Earth on 21 December."
      - heading: "Our galaxy from outside"
        job: "Opens the Milky Way seen from outside."
      - heading: "Andromeda, the nearest large galaxy"
        job: "Opens Andromeda, the nearest large galaxy."
      - heading: "The cosmic web"
        job: "Opens the cosmic web."
      - heading: "Everything we have mapped"
        job: "Opens everything Skymap has mapped."
  - heading: "Make your own link"
    job: "How do I make a link to my own view?"
    parts:
      - heading: "Find the object"
        job: "How do I find the object?"
      - heading: "Set the date"
        job: "How do I set the date and the time?"
      - heading: "Copy the address"
        job: "How do I copy the link?"
  - heading: "Before you rely on it"
    job: "What should I check before I use it in a lesson?"
    parts:
      - heading: "What it runs on"
        job: "Which browsers and devices does it need?"
      - heading: "Before the lesson"
        job: "What should I try before the lesson?"
      - heading: "Limits"
        job: "What can the links not do?"
  - heading: "Measured, derived and drawn"
    job: "How can I use the difference between measured, derived and drawn in a lesson?"
    parts:
      - heading: "Measured"
        job: "Which parts of the scene were recorded by an instrument?"
      - heading: "Derived"
        job: "Which parts are computed from measurements?"
