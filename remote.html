<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Skymap remote</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Added to the Home Screen, the remote opens without the browser's bars. The manifest has no
      start_url, so the icon opens the address it was added from, room code included. iOS reads
      the apple- tags; black-translucent draws the page under the status bar, so the remote pads
      itself by the safe-area insets.
    -->
    <link rel="manifest" href="/remote.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skymap remote" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/remoteMain.tsx"></script>
  </body>
</html>
