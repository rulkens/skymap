<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Without this, mobile browsers default to "render the page assuming
      a 980-px-wide desktop layout and let the user pinch-zoom", which
      makes window.innerWidth report ~980 even on a phone and breaks
      `initialTierFromViewport()` — it would pick the medium (600k galaxy)
      tier on devices that should be on the small (300k) tier.  Setting
      width=device-width also lets the WebGPU canvas render at native
      device pixels and stops the awkward double-tap-to-zoom behaviour.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Skymap — Interactive 3D Galaxy Catalog Explorer (WebGPU)</title>

    <!--
      Favicons.  SVG primary (browser tabs); 180×180 PNG for iOS home-screen
      shortcuts.  Both rendered from `public/favicon.svg` via
      `npx tsx tools/makeFavicon.ts` — re-run if the SVG changes.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Cormorant Garamond SemiBold and Sora Thin (100) — ExhibitOverlay's body
      voice, spec §4.3 — are both self-hosted (public/fonts/, @font-face in
      src/styles/global.css) rather than loaded from Google Fonts. A
      third-party stylesheet would block first paint on a page that otherwise
      fetches nothing off-origin, and it works offline for the Electron build.
    -->

    <!--
      ── Discovery & indexing metadata ──────────────────────────────────────
      Three audiences read what's below:
        • search engines (Google, Bing, DuckDuckGo) → snippet + sitelinks
        • social-share previewers (Twitter / Bluesky / Discord / Slack)
            → og:image card on link paste
        • LLM crawlers (GPTBot, ClaudeBot, PerplexityBot)
            → context for "what is skymap" answers in chat UIs
      Description / og / twitter / JSON-LD are all minor variations of the
      same elevator pitch; keeping them in sync by hand is fine while the
      copy is short, but if the pitch changes substantially, edit all five.
    -->
    <!--
      Description target: 110-160 chars (Google snippet sweet spot).
      Keep it action-first ("Fly through…") because the elevator pitch
      lands harder than a noun phrase in search-result previews.
    -->
    <meta
      name="description"
      content="Fly through millions of galaxies in your browser. Interactive WebGPU 3D explorer for the SDSS, GLADE, and 2MRS catalogs with cosmic-web filaments."
    />
    <meta
      name="keywords"
      content="WebGPU, galaxy, SDSS, GLADE, 2MRS, cosmology, astronomy, visualization, cosmic web, redshift, large-scale structure, gravitational waves, host galaxy"
    />
    <meta name="author" content="Alexander Rulkens" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://skymap.rulkens.com/" />

    <!--
      OpenGraph (Facebook, LinkedIn, Discord, Bluesky, generic crawlers).
      og:title target: 50-60 chars; og:description target: 110-160 chars.
      og:image is a 1200×630 JPEG (under WhatsApp's 600 KB inline-preview
      cap); regenerate with `npx tsx tools/makeOgImage.ts`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Skymap — Interactive 3D Galaxy Catalog Explorer (WebGPU)" />
    <meta
      property="og:description"
      content="Fly through millions of galaxies in your browser. WebGPU 3D explorer for the SDSS, GLADE, and 2MRS catalogs with cosmic-web filaments."
    />
    <meta property="og:url" content="https://skymap.rulkens.com/" />
    <meta property="og:image" content="https://skymap.rulkens.com/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Skymap — supercluster-scale view with the title and tagline overlaid: thousands of galaxies clustering into a dense core, filaments radiating into surrounding voids."
    />
    <meta property="og:site_name" content="Skymap" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card (Twitter / X-specific renderer) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skymap — Interactive 3D Galaxy Catalog Explorer (WebGPU)" />
    <meta
      name="twitter:description"
      content="Fly through millions of galaxies in your browser. WebGPU 3D explorer for the SDSS, GLADE, and 2MRS catalogs with cosmic-web filaments."
    />
    <meta name="twitter:image" content="https://skymap.rulkens.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Skymap supercluster view" />

    <!--
      JSON-LD structured data.  Schema.org's `SoftwareApplication` type is
      what Google's rich-results crawler looks for; LLMs that consume
      structured data (Perplexity, You.com, ChatGPT search) treat it as a
      higher-fidelity source than the surrounding HTML body.  We pin the
      DOI as `identifier` so any AI summarising the project links to the
      Zenodo archive rather than guessing a citation format.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Skymap",
        "url": "https://skymap.rulkens.com/",
        "applicationCategory": "ScienceApplication",
        "applicationSubCategory": "Astronomy / Cosmology Visualization",
        "operatingSystem": "Web Browser (WebGPU-capable)",
        "description": "Interactive WebGPU 3D explorer for the SDSS, GLADE, and 2MRS galaxy catalogs. Renders millions of galaxies as instanced billboards with selective per-galaxy thumbnail quads on close approach.",
        "author": { "@type": "Person", "name": "Alexander Rulkens" },
        "license": "https://opensource.org/licenses/MIT",
        "softwareRequirements": "WebGPU-capable browser (Chrome 113+, Edge 113+, Firefox 141+, Safari 26+)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "identifier": "https://doi.org/10.5281/zenodo.20037028",
        "image": "https://skymap.rulkens.com/og-image.jpg",
        "keywords": "WebGPU, galaxy, SDSS, GLADE, 2MRS, cosmology, astronomy, visualization, cosmic web"
      }
    </script>

    <!--
      Design tokens + page reset live in src/styles/global.css.  We import
      them from main.tsx (side-effect import) rather than linking from this
      file so Vite's module graph owns the asset and HMR works during dev.
    -->

    <!--
      Boot shell.  The app bundle is ~600 KB gzipped, which is several seconds
      of black screen on a slow mobile connection, so the first paint has to
      come from this file alone: inline styles, static markup, no request
      except the title font.  main.tsx removes #boot once React has rendered.

      The colours, font stacks and offsets repeat design tokens from
      src/styles/global.css and the Splash column's position, because that
      stylesheet arrives with the bundle.  The hairline matches SplashProgress
      so the bar carries through the handoff.
    -->
    <link
      rel="preload"
      href="/fonts/CormorantGaramond-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Cormorant Garamond';
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/CormorantGaramond-SemiBold.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        background: #000;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: #000;
        color: rgba(200, 220, 255, 0.85);
        font:
          11px/1.6 ui-monospace,
          'SF Mono',
          Menlo,
          monospace;
        letter-spacing: 0.1em;
      }
      #boot .boot-column {
        position: absolute;
        left: 80px;
        bottom: 80px;
        max-width: 440px;
      }
      #boot .boot-label {
        display: flex;
        align-items: center;
        gap: 16px;
        font-size: 10px;
        letter-spacing: 0.18em;
      }
      #boot .boot-label::before {
        content: '';
        width: 32px;
        height: 1px;
        background: #a8d0ff;
      }
      #boot h1 {
        margin: 24px 0;
        color: #fff;
        font:
          600 48px/1.04 'Cormorant Garamond',
          ui-serif,
          Georgia,
          serif;
        letter-spacing: 0.005em;
      }
      /* The three status lines share one grid cell and hand over on a timer:
         a visitor who is still here after 6 s is on a slow connection and
         needs to hear that waiting is expected. */
      #boot .boot-status {
        display: grid;
        margin: 0;
      }
      #boot .boot-status > * {
        grid-area: 1 / 1;
      }
      #boot .boot-status > :nth-child(1) {
        animation: bootOut 0.4s 6s forwards;
      }
      #boot .boot-status > :nth-child(2) {
        opacity: 0;
        animation:
          bootIn 0.4s 6s forwards,
          bootOut 0.4s 20s forwards;
      }
      #boot .boot-status > :nth-child(3) {
        opacity: 0;
        animation: bootIn 0.4s 20s forwards;
      }
      #boot .boot-failed,
      #boot.failed .boot-status,
      #boot.failed .boot-line {
        display: none;
      }
      #boot.failed .boot-failed {
        display: block;
        margin: 0;
        color: #ffb3b3;
      }
      #boot a {
        color: inherit;
      }
      #boot .boot-line {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 12px;
        height: 1px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.06);
      }
      #boot .boot-line::before {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 30%;
        background: linear-gradient(90deg, transparent, #a8d0ff, transparent);
        animation: bootSweep 1.4s ease-in-out infinite;
      }
      @keyframes bootIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes bootOut {
        to {
          opacity: 0;
        }
      }
      @keyframes bootSweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(400%);
        }
      }
      @media (max-width: 768px) {
        #boot .boot-column {
          left: 24px;
          right: 24px;
          bottom: 56px;
        }
        #boot h1 {
          margin: 20px 0;
          font-size: 32px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-line::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="boot-column">
        <div class="boot-label">SKYMAP</div>
        <h1>Welcome<br />to the universe</h1>
        <p class="boot-status" role="status">
          <span>Loading…</span>
          <span aria-hidden="true">Still loading. A slow connection needs a little longer.</span>
          <span aria-hidden="true"
            >Still loading. Keep this tab open and Skymap starts by itself.</span
          >
        </p>
        <p class="boot-failed">
          Skymap could not be loaded. Check your connection and <a href="">reload the page</a>.
        </p>
        <noscript><p>Skymap needs JavaScript and WebGPU to run.</p></noscript>
      </div>
      <div class="boot-line"></div>
    </div>
    <script>
      // A failed bundle or stylesheet request would otherwise leave the shell
      // saying "Loading…" forever.  Resource errors do not bubble: capture.
      addEventListener(
        'error',
        function (e) {
          var tag = e.target && e.target.tagName;
          var boot = document.getElementById('boot');
          if (boot && (tag === 'SCRIPT' || tag === 'LINK')) boot.className = 'failed';
        },
        true,
      );
    </script>
    <!--
      React mounts the entire app — canvas, status bar, info card, scale bar —
      into this single div. The old imperative markup (canvas, #status, #info-card,
      #scale-bar) has moved into the React component tree in src/App.tsx.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
