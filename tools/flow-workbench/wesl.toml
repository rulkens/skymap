# WESL linker configuration for the cosmic-flow tool.
#
# Cosmic Flow is a self-contained Vite sub-app, so it needs its OWN wesl.toml
# rather than the repo-root one (which only includes the runtime's
# src/services/gpu/shaders/**). wesl-plugin locates this file from the
# *explicit* `weslToml` option in tools/cosmic-flow/vite.config.ts — NOT from
# the Vite `root`. By default the plugin reads `<process.cwd()>/wesl.toml`, and
# `npm run cosmic-flow` keeps cwd at the repo root, so without the explicit path
# the plugin would pick up the runtime toml and never see these shaders.
#
# Schema notes (see the repo-root wesl.toml for the long version):
#   - `root` is resolved relative to THIS file's directory, then re-based on
#     process.cwd() internally — both stay consistent because this toml lives
#     under the cwd (the repo root).
#   - WESL `import` paths use the literal `package::` prefix; segments mirror the
#     directory tree under `root`. So
#     src/visualizations/flowField/shaders/flowConstants.wesl is imported as
#     `package::visualizations::flowField::shaders::flowConstants::NAME`.
#   - `?static` (wired in vite.config.ts) links at build time to a flat WGSL
#     string — zero runtime linker dependency, same shape as the old
#     `import x from './x.wgsl'` string modules it replaces.

edition = "unstable_2025"
include = ["src/**/*.wesl"]
root = "src"
